packages:
  - "packages/*"
  - "apps/crm/backend"
  - "apps/crm/frontend"
  - "apps/chatbot"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: set this to true or false
  prisma: true
  workerd: true

minimumReleaseAgeExclude:
  - '@puppeteer/browsers@3.1.0'
  - puppeteer-core@25.5.0

onlyBuiltDependencies:
  - esbuild
  - workerd
