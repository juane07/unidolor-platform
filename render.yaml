services:
  - type: web
    name: unidolor-crm
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@11.20.0 --activate && pnpm install && pnpm --filter @unidolor/core build && pnpm --filter @unidolor/crm-frontend build && cd apps/crm/backend && npx prisma generate
    startCommand: cd apps/crm/backend && node src/server.js
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        value: "postgresql://USER:PASSWORD@HOST:5432/postgres"
      - key: JWT_SECRET
        value: REPLACE_WITH_SECRET
      - key: PORT
        value: "8080"
      - key: WEBHOOK_API_KEY
        value: REPLACE_WITH_KEY
      - key: NODE_ENV
        value: production
