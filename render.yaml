services:
  - type: web
    name: unidolor-crm
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npx vite build && cd ../backend && npm install
    startCommand: cd backend && node src/server.js
    healthCheckPath: /
    envVars:
      - key: DATABASE
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
      - key: WEBHOOK_API_KEY
        value: unidolor-webhook-key-2026
      - key: NODE_ENV
        value: production
