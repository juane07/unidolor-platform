services:
  - type: web
    name: unidolor-crm
    runtime: docker
    plan: free
    dockerfilePath: ./apps/crm/Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
      - key: WEBHOOK_API_KEY
        value: unidolor-webhook-key-2026
      - key: NODE_ENV
        value: production
