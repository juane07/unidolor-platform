name: Sync knowledge (CRM → ChatBot)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/crm/backend/src/config/institutionalConfig.js'
      - 'packages/core/src/**'
      - 'scripts/**'
      - 'apps/chatbot/src/knowledge-base.js'

concurrency:
  group: sync-knowledge
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerar knowledge-generated.js
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @unidolor/core
        run: pnpm --filter @unidolor/core build

      - name: Run knowledge sync
        env:
          DATABASE: ${{ secrets.DATABASE }}
        run: pnpm --filter @unidolor/scripts sync:knowledge

      - name: Commit generated file (si cambió)
        run: |
          if ! git diff --quiet -- apps/chatbot/src/knowledge-generated.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/chatbot/src/knowledge-generated.js
            git commit -m "chore: sync knowledge-generated.js desde MongoDB [skip ci]"
            git push
          else
            echo "Sin cambios en knowledge-generated.js"
          fi
