name: Deploy ChatBot (Cloudflare Workers)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/chatbot/**'
      - 'packages/core/src/**'
      - 'pnpm-lock.yaml'

concurrency:
  group: deploy-chatbot
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy unidolor-bot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @unidolor/core
        run: pnpm --filter @unidolor/core build

      - name: Deploy Worker
        working-directory: apps/chatbot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
